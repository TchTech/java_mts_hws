logging:
  level:
    com.mipt.tchtech: INFO
    org.springframework: WARN

app:
  mode: Рабочий Режим

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tchtech}
    username: ${DB_USERNAME:tchtech}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true