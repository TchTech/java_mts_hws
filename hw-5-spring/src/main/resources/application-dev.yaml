logging:
  level:
    com.mipt.tchtech: DEBUG
    org.springframework: INFO

app:
  mode: Режим Разработки

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tchtech
    username: tchtech
    password: tchtech
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true